[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2-md-toolkit"
version = "0.1.0"
description = "Educational H2-only Lennard-Jones MD and molecular-center trajectory analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abdelateef M. Adam"}]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]
keywords = ["molecular-dynamics", "hydrogen", "diffusion", "radial-distribution-function", "scientific-python"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
h2md = "h2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
