[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2-md-toolkit"
version = "1.0.0"
description = "Hydrogen molecular dynamics: educational models and paper-based two-site LJ LAMMPS workflow"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abdelateef M. Adam"}]
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "plotly>=5.17"]
keywords = ["molecular-dynamics", "hydrogen", "diffusion", "radial-distribution-function", "scientific-python"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
validation = ["CoolProp>=6.6", "scipy>=1.10"]

[project.scripts]
h2md = "h2md.cli:main"
h2md-workflow = "h2md.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
